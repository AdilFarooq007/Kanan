<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Watson Chatbot</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    .header {
      padding: 24px;
      text-align: center;
      background: #161616;
      color: white;
    }
    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .header p {
      margin: 0;
      color: #ddd;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>My Watson Chatbot</h1>
    <p>Welcome! Click the chat button to start a conversation.</p>
  </div>

  <script>
    window.watsonAssistantChatOptions = {
      integrationID: "2afc3d61-77f9-405b-9918-7e4f3521716a",
      region: "https://integrations.au-syd.assistant.watson.appdomain.cloud",
      serviceInstanceID: "c4363f4f-3517-4c71-9b25-23251aac0356",
      onLoad: async (instance) => { await instance.render(); }
    };

    setTimeout(function() {
      const t = document.createElement('script');
      t.src = "https://web-chat.global.assistant.watson.appdomain.cloud/versions/" +
        (window.watsonAssistantChatOptions.clientVersion || 'latest') +
        "/WatsonAssistantChatEntry.js";
      document.head.appendChild(t);
    });
  </script>

</body>
</html>
